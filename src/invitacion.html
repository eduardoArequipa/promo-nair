<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#124734"/><title>Mi promoción · Octavio Campero Echazú</title>
<link rel="icon" type="image/svg+xml" href="/birrete.svg"/>
<link rel="stylesheet" href="/invitacion.css"/>
</head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<g id="rama"><path d="M4 97 Q61 67 68 4" fill="none" stroke="currentColor" stroke-width="1.2"/>
<g transform="translate(6.00 95.00) rotate(-10.00)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
<g transform="translate(17.05 86.92) rotate(-14.62)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
<g transform="translate(27.19 77.94) rotate(-19.25)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
<g transform="translate(36.42 68.05) rotate(-23.88)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
<g transform="translate(44.75 57.25) rotate(-28.50)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
<g transform="translate(52.17 45.55) rotate(-33.12)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
<g transform="translate(58.69 32.94) rotate(-37.75)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
<g transform="translate(64.30 19.42) rotate(-42.38)"><path d="M0 0 Q-15 -5 -13 -20 Q-2 -15 0 0 M1 -1 Q9 -18 21 -16 Q16 -4 1 -1" fill="currentColor"/></g>
</g>
<symbol id="bouquet" viewBox="0 0 205 170">
  <use href="#rama" transform="translate(78 -58) rotate(68 4 97) scale(1.25)" fill-opacity=".7"/>
  <use href="#rama" transform="translate(38 -86) rotate(115 4 97) scale(1.15)"/>
  <use href="#rama" transform="translate(7 -72) rotate(152 4 97) scale(1.35)" opacity=".6"/>
  <use href="#rama" transform="translate(8 -72) rotate(105 4 97) scale(.9)" opacity=".45"/>
</symbol>
<symbol id="orn" viewBox="0 0 180 110"><use href="#rama" transform="translate(86 1)"/><use href="#rama" transform="translate(94 1) scale(-1 1)"/></symbol>
<symbol id="cap" viewBox="0 0 60 40"><path d="m3 13 27-11 27 11-27 11z M13 21v9q17 13 34 0v-9l-17 7z" fill="currentColor"/><path d="M55 15v15" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="almuerzo" viewBox="0 0 60 40"><g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 30h52M8 27a22 22 0 0 1 44 0zM13 34h34"/><circle cx="30" cy="4" r="2"/></g></symbol>
</defs></svg>
<header><span class="brand"><svg aria-hidden="true"><use href="#cap"/></svg> Octavio Campero Echazú</span><span class="location">Tarija <i>✦</i> Bolivia</span></header>
<main>
<section id="cover" class="paper">
<div class="border"></div>
<div class="botanical top" aria-hidden="true"><svg viewBox="0 0 205 170"><use href="#bouquet"/></svg></div>
<div class="botanical bottom" aria-hidden="true"><svg viewBox="0 0 205 170"><use href="#bouquet"/></svg></div>
<div class="glints" aria-hidden="true"><i>✧</i><i>✦</i><i>✧</i><i>✦</i><i>✧</i><i>✦</i></div>
<div class="crest"><svg class="wreath"><use href="#orn"/></svg><svg class="cap"><use href="#cap"/></svg></div>
<p class="eyebrow">Acto de graduación</p>
<h1>Mi <em>promoción</em></h1>
<div class="divider" aria-hidden="true">✦</div>
<p class="school">Colegio Octavio Campero Echazú</p><p class="name" data-name></p>
<p id="cover-date" class="cover-date"></p>
<button class="envelope" id="open" aria-label="Abrir la invitación"><span class="letter" aria-hidden="true"><svg><use href="#orn"/></svg></span><span class="pocket"></span><span class="flap"></span><span class="seal"><svg aria-hidden="true"><use href="#cap"/></svg></span></button>
<p class="hint">Tocá el sello para abrir</p>
</section>
<article id="inside" hidden>
<section class="hero">
  <div class="hero-photo" aria-hidden="true"></div>
  <div class="celebration" aria-hidden="true"></div>
  <div class="hero-copy">
    <p class="eyebrow">Mi promoción</p>
    <h2 id="title" tabindex="-1">Acto de graduación</h2>
    <p class="hero-school">Colegio Octavio Campero Echazú</p>
    <time id="hero-date"></time>
  </div>
</section>
<section class="details">
<img id="portrait" width="960" height="960" alt="Ilustración de un perrito con toga y birrete" hidden/>
<div class="divider" aria-hidden="true">✦</div>
<blockquote id="dedication"></blockquote><div class="act-card"><svg class="laurel"><use href="#orn"/></svg><h2>El gran día</h2><time id="date" class="calendar"></time><section id="clock" aria-label="Cuenta regresiva" hidden>
<p class="eyebrow">Faltan</p>
<div id="count" role="timer">
<span><b>00</b>Días</span><span><b>00</b>Horas</span><span><b>00</b>Minutos</span><span><b>00</b>Segundos</span>
</div>
</section></div>
<div id="programa" class="programa"></div>
<template id="actividad">
  <section class="actividad">
    <h2 class="eyebrow"></h2>
    <svg class="actividad-icono" aria-hidden="true"><use></use></svg>
    <p class="recinto"></p><p class="direccion"></p>
    <div class="acciones"><span class="horario"></span><a target="_blank" rel="noopener noreferrer">Ver ubicación</a></div>
  </section>
</template></section></article></main>
<button id="music" hidden>Reproducir música</button><audio id="audio" loop preload="none"></audio>
<script type="module" src="/invitacion.js"></script>
</body></html>
